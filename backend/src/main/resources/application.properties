# ==============================================================
# Hospital Management Dashboard - Backend (DA2)
# Oracle connection is fully driven by environment variables.
# Never hardcode credentials here.
# ==============================================================

spring.application.name=hospital-dashboard-backend
server.port=8080

# --- Oracle DataSource (values injected via environment variables) ---
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:system}
spring.datasource.password=${DB_PASSWORD:ronak}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP basic pool sizing (kept small/simple for an academic project)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# --- Optional Neo4j graph database ---
# Disabled by default so the existing Oracle-backed application is unaffected
# until a local Neo4j instance and credentials are deliberately configured.
app.neo4j.enabled=${NEO4J_ENABLED:false}
app.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
app.neo4j.username=${NEO4J_USERNAME:}
app.neo4j.password=${NEO4J_PASSWORD:}
app.neo4j.database=${NEO4J_DATABASE:neo4j}

# --- CORS: allow the local frontend dev origin (configurable) ---
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# --- Jackson: don't fail on empty beans, keep dates readable ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Logging ---
logging.level.org.springframework.jdbc.core=INFO
logging.level.com.hospital.dashboard=DEBUG
